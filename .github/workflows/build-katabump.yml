name: Build KataBump bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install production dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Create flat KataBump bundle
        run: |
          rm -rf katabump-final
          mkdir katabump-final
          cp index.js config.js katabump-final/
          cat > katabump-final/package.json <<'EOF'
          {
            "name": "minecraft-afk-bot-26-2",
            "version": "2.0.0",
            "private": true,
            "description": "Minimal Minecraft 26.2 AFK protocol client",
            "main": "index.js",
            "scripts": {
              "start": "node index.js"
            },
            "engines": {
              "node": ">=22"
            }
          }
          EOF
          cp -r node_modules katabump-final/
          test -f katabump-final/node_modules/minecraft-protocol/package.json
          node -e "process.chdir('katabump-final'); require('minecraft-protocol'); console.log('minecraft-protocol OK')"

      - name: Upload flat bundle
        uses: actions/upload-artifact@v4
        with:
          name: KataBump-final
          path: katabump-final/
          include-hidden-files: false
          retention-days: 7
