name: Build KataBump bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install production dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Create KataBump ZIP
        run: |
          rm -rf katabump-bundle
          mkdir katabump-bundle
          cp index.js config.js katabump-bundle/
          cat > katabump-bundle/package.json <<'EOF'
          {
            "name": "minecraft-afk-bot-26-2",
            "version": "2.0.0",
            "private": true,
            "description": "Minimal Minecraft 26.2 AFK protocol client",
            "main": "index.js",
            "scripts": {
              "start": "node index.js"
            },
            "engines": {
              "node": ">=22"
            }
          }
          EOF
          cp -r node_modules katabump-bundle/
          cd katabump-bundle
          zip -qr ../Bot-afk-KataBump.zip index.js config.js package.json node_modules

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bot-afk-KataBump
          path: Bot-afk-KataBump.zip
          retention-days: 7
